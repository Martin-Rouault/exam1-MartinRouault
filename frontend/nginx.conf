server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Application monopage : toutes les routes (/cart, /admin…) renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers versionnés par le build (hash dans le nom) : cache long
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Ne pas exposer la version de Nginx
    server_tokens off;
}
